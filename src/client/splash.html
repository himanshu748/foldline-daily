<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Foldline Daily</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <button class="launch" id="launch" type="button" aria-describedby="summary">
      <span class="launch__top">
        <span class="launch__brand">Foldline</span>
        <span class="launch__day num" id="day"></span>
      </span>
      <span class="launch__stage">
        <canvas id="board" aria-hidden="true"></canvas>
        <svg class="launch__hand" id="hand" viewBox="0 0 32 40" aria-hidden="true">
          <path
            d="M12 2a3 3 0 0 1 3 3v13l8.5 2.2A4 4 0 0 1 26.4 25L25 34a4 4 0 0 1-4 3.4h-7.2a4 4 0 0 1-3.2-1.6l-6.9-9.3a2.6 2.6 0 0 1 3.9-3.4L10 26V5a3 3 0 0 1 2-3z"
            fill="#fff"
            stroke="#14201e"
            stroke-width="2"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span class="launch__bottom">
        <span class="launch__meta">
          <span class="launch__pips" id="pips" aria-hidden="true"></span>
          <span class="launch__line" id="summary"></span>
        </span>
        <span class="btn btn--primary launch__play" id="play">
          <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 1l11 6-11 6z" fill="currentColor" /></svg>
          <span id="playLabel">Play</span>
        </span>
      </span>
    </button>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
